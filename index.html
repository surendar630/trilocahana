.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.hero .w{position:relative}
.badge{position:relative;width:150px;height:150px;margin:0 auto;border-radius:50%;animation:fl 4s ease-in-out infinite;filter:drop-shadow(0 0 28px rgba(255,170,80,.55))}
.badge:before{content:"";position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(from 0deg,#f07a10,#ffd08a,#0a6fc2,#7fe0ae,#f07a10);animation:sp 6s linear infinite}
.badge:after{content:"";position:absolute;inset:-16px;border-radius:50%;border:2px dashed rgba(255,208,138,.6);animation:sp 18s linear infinite reverse}
.badge img{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;background:#fff;object-fit:cover;border:4px solid #fff}
@keyframes fl{50%{transform:translateY(-8px)}}@keyframes sp{to{transform:rotate(360deg)}}@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
h1{font-size:clamp(32px,7vw,58px);line-height:1.1;margin:18px 0 8px;letter-spacing:-1px}h1 em{font-style:normal;color:#ffb36b}
.type{font-size:clamp(18px,3.5vw,26px);font-weight:700;color:#7fe0ae;min-height:36px}
.lead{max-width:700px;margin:10px auto 0;color:#cfdcf0}
.btn{display:inline-block;background:var(--ac);color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px;margin:16px 6px 0;border:0;font:inherit;font-weight:700;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(240,122,16,.4)}.btn.o{background:transparent;border:2px solid #9cc4f0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:34px}
.stats div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:14px 6px}

.ph .big{position:absolute;right:-10px;top:-14px;font-size:170px;opacity:.16;transform:rotate(-8deg)}
.ph .w{position:relative}.ph small{letter-spacing:2px;color:#ffd08a;font-weight:700}
.ph h1{font-size:clamp(30px,6vw,48px);margin:6px 0}.ph p{margin:0;color:#dbe7f7;max-width:640px;font-size:18px}
section{padding:34px 0}h2{font-size:clamp(22px,4vw,30px);margin:0 0 6px}h3{margin:0 0 6px}h2+p{margin:0 0 18px;color:var(--mu)}
.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:0 6px 24px rgba(10,40,90,.06);animation:pop .45s both}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.ic{font-size:32px;display:block;margin-bottom:4px}
.hv{transition:.25s;cursor:pointer}.hv:hover{transform:translateY(-6px);border-color:var(--pc)}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:5px;max-width:560px;margin:0 auto 20px}
.seg button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-weight:700;padding:11px 6px;border-radius:999px;cursor:pointer}
.seg button.on{background:linear-gradient(90deg,var(--pr),#2a8de0);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chips button{width:46px;height:46px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-weight:800;cursor:pointer;transition:.2s}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff;transform:scale(1.12)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:4px 0 14px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gr),var(--pr));transition:width .5s}
.tag{display:inline-block;background:color-mix(in srgb,var(--gr) 16%,transparent);color:var(--gr);font-weight:700;font-size:13px;border-radius:99px;padding:4px 12px;margin:0 6px 6px 0}
.path{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.path button,.pill{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:700;border-radius:14px;padding:10px 14px;cursor:pointer}
.path button.on,.pill.on{background:var(--gr);color:#fff;border-color:var(--gr)}
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:center}
@media(max-width:760px){.split{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
.split img{width:100%;border-radius:18px;box-shadow:0 14px 40px rgba(10,40,90,.25)}
.pts div{padding:10px 14px;border-left:4px solid var(--ac);background:var(--card);border-radius:0 12px 12px 0;margin-bottom:10px;font-weight:600}
input[type=range]{width:100%;accent-color:var(--ac)}
.demo{background:linear-gradient(135deg,#0d1b33,#12305c);color:#fff;border-radius:20px;padding:20px;margin-top:20px}
.demo h3{color:#ffd08a}.big2{font-size:30px;font-weight:800;color:#7fe0ae}
pre{background:#0d1b33;color:#cde3ff;border-radius:14px;padding:16px;overflow:auto;font-size:14px;margin:0}
.road{position:relative;height:70px;background:#1b2a47;border-radius:12px;margin:12px 0;overflow:hidden}
.road span{position:absolute;top:10px;font-size:40px;transition:.3s}
.tl{border-left:3px solid var(--pc);margin:12px 0 0 8px}.tl div{position:relative;padding:5px 0 11px 20px}
.tl div:before{content:"";position:absolute;left:-9px;top:11px;width:15px;height:15px;border-radius:50%;background:var(--ac)}
.pn{display:flex;gap:10px;justify-content:space-between;padding:10px 0 40px}
.pn button{flex:1;max-width:340px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:14px;font:inherit;font-weight:700;cursor:pointer;text-align:left;transition:.2s}
.pn button:hover{border-color:var(--ac);transform:translateY(-3px)}.pn small{display:block;color:var(--mu);font-weight:600}
.cta{background:linear-gradient(135deg,#0d1b33,#0a6fc2);color:#fff;border-radius:24px;padding:36px 20px;text-align:center}
.note{font-size:13px;color:var(--mu);margin-top:12px}
footer{text-align:center;color:var(--mu);font-size:13px;padding:6px 0 40px}
#v{animation:pop .4s}
.f{display:grid;gap:10px;margin-top:8px}.f input,.f select,.f textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}.f textarea{min-height:90px}.f .grid{gap:10px}.bk{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;margin:0 8px 12px 0;transition:.2s}.bk:hover{background:var(--ac);border-color:var(--ac)}</style>

PG_.programme={t:"The Programme",i:"🧭",c:"#0a6fc2",k:"PROGRAMME",s:"A progressive technology journey from STEM to AI, designed for continuous academic engagement.",r:function(){return '<section><div class="w"><h2>Who is it for?</h2><p>Grades 1–10 and school-wide engagement: age-appropriate, aligned with the school curriculum, hands-on and lab-based.</p><div class="seg" id="seg"><button data-v="school">🏫 Schools</button><button data-v="ug">🎓 UG</button><button data-v="pg">🔬 PG</button></div><div id="aud"></div></div></section><section><div class="w"><h2>The learning journey</h2><p>Tap a stage or press play.</p><div class="path" id="path"></div><div class="card"><div class="bar"><i id="pb"></i></div><h3 id="pt"></h3><div id="pi" class="mu"></div></div><button class="btn" id="play" style="background:var(--pr)">▶ Play journey</button></div></section>'},n:function(){aud();journey()}};
PG_.cs={t:"Computer Science",i:"💻",c:"#6a3de8",k:"TOPICS",s:"From computational thinking to engineering applications.",r:function(){var g=[["🖥️","Digital Literacy & Productivity",["Computer basics","Hardware/software","Digital systems","Internet","Cybersecurity","Data Science"]],["🧩","Computational Thinking & Coding",["Algorithms","Scratch Programming","Python programming"]],["🧠","AI Literacy",["AI concepts","Machine Learning","Prompt Engineering","Responsible AI"]]];return '<section><div class="w"><div class="grid">'+g.map(function(x,i){return '<div class="card" style="animation-delay:'+i*90+'ms"><span class="ic">'+x[0]+'</span><h3>'+x[1]+'</h3>'+x[2].map(function(t){return '<span class="tag">'+t+'</span>'}).join("")+'</div>'}).join("")+'</div></div></section>'}};
PG_.electronics={t:"Electronics",i:"⚡",c:"#e8a500",k:"HANDS-ON",s:"Learning how technology works at the physical level.",r:function(){return '<section><div class="w">'+cards([["⚡","Electricity, voltage, current and resistance"],["🔗","Series and parallel circuits"],["🔋","Batteries, LEDs, switches and resistors"],["🍞","Breadboards and buzzers"],["⚙️","Motors and potentiometers"],["📈","Analogue and digital signals"],["🔍","Simple sensors and practical circuits"]])+'<div class="demo"><h3>Try it: Ohm’s law (V = I × R)</h3><div>Voltage: <b id="vv"></b> V<input id="v1" type="range" min="1" max="12" value="5"></div><div>Resistance: <b id="rv"></b> Ω<input id="r1" type="range" min="10" max="1000" step="10" value="220"></div><div class="big2" id="ci"></div><div class="bar"><i id="lb"></i></div><div id="lt"></div><div class="note" style="color:#9fb4d6">Illustrative calculator for classroom discussion.</div></div></div></section>'},n:function(){function u(){var v=+$("v1").value,r=+$("r1").value,i=v/r*1000;$("vv").textContent=v;$("rv").textContent=r;$("ci").textContent=i.toFixed(1)+" mA";$("lb").style.width=Math.min(100,i/30*100)+"%";$("lt").textContent=i<5?"💡 Very dim: too little current":i<=25?"💡 Bright and safe range for a typical LED":"🔥 Too much current for a small LED. Use a bigger resistor!"}$("v1").oninput=u;$("r1").oninput=u;u()}};
PG_.sensors={t:"Sensors & Physical Computing",i:"📡",c:"#0f9d8a",k:"CODE MEETS WORLD",s:"Connecting code with the physical world.",r:function(){return '<section><div class="w">'+cards([["📡","Sensors, actuators and motors"],["🧠","Microcontroller-based platforms"],["🎚️","Control and sensing"],["🔌","Practical input/output concepts"],["🌐","Introduction to IoT"],["🤖","Automation-oriented activities"]])+'<div class="demo"><h3>Students learn to…</h3><div class="path" id="cyc"></div><div id="cyi" style="margin-top:6px"></div></div></div></section>'},n:function(){var c=[["🔭 Observe","Notice what the sensor reads."],["🔨 Build","Connect the circuit and write the logic."],["🧪 Test","Run it and see what actually happens."],["🔁 Improve","Refine and try again."]],i=0;function s(k){i=k;$("cyc").innerHTML=c.map(function(x,j){return '<button class="pill'+(j==k?' on':'')+'" data-i="'+j+'">'+x[0]+'</button>'}).join("");$("cyi").textContent=c[k][1]}$("cyc").onclick=function(e){var b=e.target.closest("button");if(b)s(+b.getAttribute("data-i"))};s(0)}};
PG_.robotics={t:"Robotics",i:"🤖",c:"#d6336c",k:"MOTION",s:"From components to intelligent movement.",r:function(){return '<section><div class="w">'+cards([["🛞","Robot and drone components"],["🧱","Chassis and mechanisms"],["🚗","Motors and wheels"],["🎛️","Motor drivers"],["🦾","Servo motors"],["📶","IR and ultrasonic sensors"],["➖","Line sensors"],["🧭","Autonomous movement and navigation"],["🧮","Algorithms and control logic"]])+'<div class="demo"><h3>Try it: obstacle sensing</h3>Distance to obstacle: <b id="dv"></b> cm<input id="d1" type="range" min="5" max="100" value="70"><div class="road"><span id="rb">🤖</span><span id="ob">🧱</span></div><div class="big2" id="dt"></div></div></div></section>'},n:function(){function u(){var d=+$("d1").value;$("dv").textContent=d;$("rb").style.left="6px";$("ob").style.left=(18+(d-5)/95*68)+"%";$("dt").textContent=d<25?"🛑 Obstacle! Stop and turn":d<50?"⚠️ Slow down":"✅ Path clear: move forward"}$("d1").oninput=u;u()}};
PG_.python={t:"Python Programming",i:"🐍",c:"#2f9e44",k:"CODING",s:"Practical programming for the next generation, introduced progressively at the higher grades.",r:function(){return '<section><div class="w">'+cards([["🐍","Python environment"],["🔤","Variables and data types"],["⌨️","Input/output"],["🔀","Conditions and loops"],["🧰","Functions and lists"],["📊","Basic data handling"],["🧮","Algorithms and problem solving"],["📱","Mini applications"],["🤖","Sensors, automation and robotics applications"]])+'<div class="demo"><h3>The kind of logic students write</h3><pre id="code"></pre><div class="note" style="color:#9fb4d6">Illustrative example. Focus: practical programming rather than syntax memorization.</div></div></div></section>'},n:function(){var s="distance = read_sensor()\n\nif distance < 20:\n    turn_right()\nelse:\n    move_forward()",i=0,e=$("code");(function t(){if(!e.isConnected)return;e.textContent=s.slice(0,i)+"▍";i=i>=s.length?0:i+1;setTimeout(t,i==0?1500:70)})()}};

PG_.about={t:"About Trilochana",i:"🚀",c:"#0d1b33",k:"THE COMPANY",s:"Building India’s next generation aerospace, autonomous systems and defence technologies.",r:function(){return '<section><div class="w"><div class="card"><p style="margin:0">Founded in September 2023, Trilochana Aerospace and Defence Technologies Pvt. Ltd. (DIPP163178) is an innovation-driven startup designing, developing and manufacturing indigenous autonomous systems, aerospace subsystems, intelligent sensors and advanced software platforms under Make in India.</p></div><div class="grid" style="margin-top:14px"><div class="card"><h3>🔭 Vision</h3><div class="mu">A globally recognized Indian aerospace technology company with indigenous autonomous systems, aerospace components, intelligent sensing and AI-enabled defence solutions.</div></div><div class="card"><h3>🎯 Mission</h3><div class="mu">Design, develop, manufacture and commercialize innovative aerospace technologies using advanced engineering, AI, indigenous manufacturing and strategic partnerships, while nurturing skilled manpower.</div></div></div><h2 style="margin-top:28px">Core business verticals</h2>'+cards([["🎓","Aerospace Education & Capacity Building"],["🛩️","Unmanned Vehicles"],["📡","Sensors and Intelligent Devices"],["🧠","AI & Software Platforms"],["🏭","Aerospace Components Manufacturing"],["🔌","Aerospace Electronics & Subsystems"]])+'<h2 style="margin-top:28px">Current products</h2>'+cards([["🎓","Skill development programs in aerospace and emerging technologies"],["🧪","STEM and aerospace laboratories"],["🖥️","Situational awareness dashboard"],["👁️","AI vision software for drone, anti-drone systems and civil applications"]])+'<h2 style="margin-top:28px">Achievements and interactions</h2><div class="seg" id="yseg" style="max-width:380px"></div><div class="card"><div class="tl" id="tl"></div></div><h2 style="margin-top:28px">Cofounders</h2><div class="grid"><div class="card"><h3>Dr. Chintamani Pai</h3><div class="mu">Researcher in photo
